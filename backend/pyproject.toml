[project]
name = "make-story-book-backend"
version = "0.1.0"
description = "绘本创作 Web 应用后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "pillow>=10.4.0",
    "playwright>=1.48.0",
    "pypdf>=5.1.0",
    "fonttools>=4.54.0",
    "volcengine-python-sdk[ark]>=1.0.0",
]

[dependency-groups]
dev = [
    "brotli>=1.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
